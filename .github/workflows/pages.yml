name: Deploy samples to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Publish the browser heads
        run: |
          dotnet publish samples/AvaEnyo.Gallery.Browser -c Release -o publish/gallery
          dotnet publish samples/Demos/AvaEnyo.Mail.Browser -c Release -o publish/mail
          dotnet publish samples/Demos/AvaEnyo.Photos.Browser -c Release -o publish/photos
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r publish/gallery/wwwroot/. site/
          mkdir -p site/mail site/photos
          cp -r publish/mail/wwwroot/. site/mail/
          cp -r publish/photos/wwwroot/. site/photos/
          # Skip Jekyll so folders starting with "_" (e.g. _framework) are served.
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
